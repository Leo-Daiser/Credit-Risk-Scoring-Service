services:
  db:
    image: postgres:16
    container_name: credit_risk_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: credit_risk_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_KEY: ${API_KEY:-}
      PARTNER_POSTBACK_SECRET: ${PARTNER_POSTBACK_SECRET:-}
      REAL_PARTNER_SECRET: ${REAL_PARTNER_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts/models:/app/artifacts/models:ro
      - ./artifacts/uploads:/app/artifacts/uploads
      - ./artifacts/predictions:/app/artifacts/predictions
    command: >-
      sh -c "python -m src.db.migrate &&
      exec uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    container_name: credit_risk_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./artifacts/models:/app/artifacts/models:ro
      - ./artifacts/uploads:/app/artifacts/uploads
      - ./artifacts/predictions:/app/artifacts/predictions
    command: ["python", "-m", "src.worker.main"]
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
    container_name: credit_risk_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
