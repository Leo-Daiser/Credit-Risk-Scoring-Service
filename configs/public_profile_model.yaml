source:
  application_train_path: data/raw/home_credit/application_train.csv
  normalized_output_path: data/processed/public_profile_training.parquet
  max_rows: 80000

training:
  random_seed: 42
  validation_size: 0.20
  calibration_size: 0.15
  calibration_method: sigmoid
  logistic:
    max_iter: 800
    solver: lbfgs
    class_weight: balanced
    C: 0.8
  catboost:
    iterations: 240
    depth: 6
    learning_rate: 0.05
    auto_class_weights: Balanced
    l2_leaf_reg: 6.0
  acceptance_gates:
    min_roc_auc: 0.60
    max_brier_score: 0.12

outputs:
  bundle_path: artifacts/models/public_profile_model_bundle.joblib
  metrics_path: artifacts/metrics/public_profile_model_metrics.json
  feature_schema_path: artifacts/reports/public_profile_model_feature_schema.json

provenance:
  training_source: Home Credit Default Risk public dataset (application_train only)
  population_limitations: >-
    The v2 public contract is trained on an open non-Russian historical population and
    estimates a default-risk signal, not approval. It must not be represented
    as Russian bank underwriting and is designed to be replaced by a
    Russia-relevant source without changing the public API contract. Existing
    debt payments are unavailable in the source and are zero in training v1;
    this covariate requires a future relevant dataset before relying on it.
