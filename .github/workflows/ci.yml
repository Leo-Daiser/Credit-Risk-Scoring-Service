name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: credit_user
          POSTGRES_PASSWORD: credit_pass
          POSTGRES_DB: credit_risk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credit_user -d credit_risk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://credit_user:credit_pass@localhost:5432/credit_risk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - run: alembic upgrade head
      - run: ruff check src tests migrations scripts
      - run: pytest -q
      - run: python -m py_compile scripts/smoke_public_demo.py
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.demo.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.public.example.yml config --quiet
      - run: docker build --tag credit-risk-scoring:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: docker build --tag riskline-frontend:ci .

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    env:
      E2E_FRONTEND_URL: http://127.0.0.1:3000
      E2E_BACKEND_URL: http://127.0.0.1:8000
      # Trusted model artifacts and raw training data are intentionally absent
      # from Git. Full ML assertions run in the local demo acceptance pass.
      E2E_REQUIRE_ML: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up -d db migrate
      - run: docker compose run --rm api python -m src.cli setup-demo
      - run: docker compose up -d api frontend
      - run: |
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && \
            curl --fail --silent http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs api frontend
          exit 1
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose down -v
