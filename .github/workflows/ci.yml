name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: credit_user
          POSTGRES_PASSWORD: credit_pass
          POSTGRES_DB: credit_risk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credit_user -d credit_risk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://credit_user:credit_pass@localhost:5432/credit_risk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - run: alembic upgrade head
      - run: ruff check src tests migrations
      - run: pytest -q
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker build --tag credit-risk-scoring:ci .
